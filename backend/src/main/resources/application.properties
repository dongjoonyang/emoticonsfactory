spring.application.name=emoticonsfactory-spring

# H2 Console 사용 허용
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 1. DB 접속 주소 변경 (메모리 -> 파일 저장)
# ~/emoticon_db 라고 적으면 맥북의 사용자 홈 폴더에 실제 파일로 저장됩니다.
spring.datasource.url=jdbc:h2:file:~/data/emoticon_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. JPA 설정 추가 (실 서비스 운영을 위한 필수 설정)
# 서버 재시작 시 기존 데이터를 유지하면서 변경된 구조만 반영합니다.
spring.jpa.hibernate.ddl-auto=update
# DB 종류를 H2로 명확히 지정합니다.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# SQL 쿼리 로그 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true